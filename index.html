<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>디데이 25</title>
<meta name="apple-mobile-web-app-title" content="디데이 25">
<meta name="application-name" content="디데이 25">
<style>
  :root {
    --bg: #f6f4ef; --card: #fffdf8; --ink: #1f1d1a; --sub: #6f6a61; --line: #e4dfd4;
    --hot: #b3261e; --warm: #a15c00; --tag: #ece7dc; --mine: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --card: #1f1e1b; --ink: #ece8df; --sub: #9a948a; --line: #2e2c28;
            --hot: #f2867e; --warm: #e0a24f; --tag: #2a2824; --mine: #8cc4b0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  header { padding: 20px 16px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
  .meta { color: var(--sub); font-size: 12px; }
  .btns { display: flex; gap: 6px; flex: none; }
  button.ghost { border: 1px solid var(--line); background: var(--card); color: var(--ink);
                 border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  button.solid { border: 0; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 5px 11px; font-size: 13px; }
  .note { margin: 0 16px; font-size: 12px; color: var(--sub); }
  .adminbar { margin: 8px 16px 0; font-size: 12px; color: var(--mine); }
  section { padding: 4px 16px 8px; }
  h2 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 16px 0 6px; }
  .item { display: flex; gap: 14px; padding: 12px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
  .when { flex: none; width: 64px; text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }
  .md { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .wd { font-size: 12px; color: var(--sub); }
  .dd { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; }
  .hot { color: var(--hot); } .warm { color: var(--warm); }
  .body { min-width: 0; flex: 1; }
  .title { font-weight: 600; }
  .time { font-size: 14px; margin-top: 2px; }
  .time b { font-weight: 700; }
  .time .none { color: var(--sub); }
  .tags { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { background: var(--tag); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .tag.mine { color: var(--mine); }
  .detail { font-size: 13px; color: var(--sub); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .acts { margin-top: 8px; display: flex; gap: 6px; }
  .acts button { border: 1px solid var(--line); background: transparent; color: var(--sub);
                 border-radius: 6px; padding: 2px 10px; font-size: 12px; }
  .msg { color: var(--sub); padding: 32px 16px; text-align: center; }
  .msg input { width: 100%; margin-top: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
               background: var(--card); color: var(--ink); font-size: 15px; }
  .msg button { margin-top: 8px; width: 100%; padding: 10px; border: 0; border-radius: 8px;
                background: var(--ink); color: var(--bg); font-size: 15px; }

  /* 편집 창 */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; }
  .sheet.on { display: flex; }
  .panel { width: 100%; max-width: 520px; background: var(--card); border-radius: 14px 14px 0 0; padding: 16px 16px 24px; }
  .panel h3 { margin: 0 0 12px; font-size: 16px; }
  .panel label { display: block; font-size: 12px; color: var(--sub); margin: 10px 0 4px; }
  .panel input, .panel select, .panel textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; }
  .panel textarea { min-height: 64px; resize: vertical; }
  .row2 { display: flex; gap: 8px; } .row2 > div { flex: 1; }
  .panel .foot { display: flex; gap: 8px; margin-top: 16px; }
  .panel .foot button { flex: 1; padding: 10px; font-size: 15px; }
  .err { color: var(--hot); font-size: 13px; margin-top: 8px; min-height: 1em; }

  /* 탭 */
  .tabs { display: flex; gap: 6px; margin: 10px 16px 0; }
  .tabs button { flex: 1; padding: 8px; border: 1px solid var(--line); background: var(--card); color: var(--sub);
                 border-radius: 8px; font-size: 14px; font-weight: 600; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* 실습 준비물 */
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .dayhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .dayhead .dt { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .dayhead .dd { margin: 0; }
  .subj { padding: 8px 0; border-top: 1px dashed var(--line); }
  .subj:first-of-type { border-top: 0; }
  .subjname { font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .subjname button { border: 1px solid var(--line); background: transparent; color: var(--sub); border-radius: 6px; padding: 1px 8px; font-size: 12px; }
  .sup { margin-top: 4px; font-size: 14px; }
  .sup .k { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin-right: 6px; background: var(--tag); color: var(--sub); }
  .sup .k.once { color: var(--warm); }
  .sup .sd { font-size: 12px; color: var(--sub); margin-left: 2px; }
  .sup .acts { margin-top: 4px; }
  .none2 { font-size: 13px; color: var(--sub); margin-top: 2px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>디데이 25</h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </div>
  <div class="btns">
    <button class="solid" id="addBtn" style="display:none" onclick="TAB === 'sup' ? openSup(null) : openEdit(null)">＋ 추가</button>
    <button class="ghost" onclick="refresh()">새로고침</button>
  </div>
</header>
<p class="note">카톡 공지를 AI가 자동으로 정리한 목록입니다. 빠지거나 틀릴 수 있으니 중요한 건 꼭 원문 공지를 확인하세요.</p>
<div class="adminbar" id="adminbar" style="display:none">관리자 모드 · 고치거나 지운 내용은 다음 정리 때도 유지됩니다</div>
<div class="tabs">
  <button id="tabTasks" onclick="setTab('tasks')">마감 일정</button>
  <button id="tabSup" onclick="setTab('sup')">실습 준비물</button>
</div>
<main id="list"></main>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeEdit()">
  <div class="panel">
    <h3 id="edTitle">일정 추가</h3>
    <label>제목</label>
    <input id="fTitle" maxlength="60" placeholder="예: 보존 실습 보고서 제출">
    <div class="row2">
      <div><label>날짜</label><input id="fDate" type="date"></div>
      <div><label>시각 (모르면 비워두기)</label><input id="fTime" type="time"></div>
    </div>
    <label>공지방</label>
    <select id="fRoom"></select>
    <label>메모 (장소·준비물·대상 등)</label>
    <textarea id="fDetail" maxlength="500"></textarea>
    <div class="err" id="fErr"></div>
    <div class="foot">
      <button class="ghost" onclick="closeEdit()">취소</button>
      <button class="solid" id="fSave" onclick="save()">저장</button>
    </div>
  </div>
</div>

<div class="sheet" id="ssheet" onclick="if(event.target===this)closeSup()">
  <div class="panel">
    <h3 id="sTitle">준비물 추가</h3>
    <label>과목</label>
    <select id="sSubject"></select>
    <label>날짜 (비워두면 매 실습마다 챙길 것)</label>
    <input id="sDate" type="date">
    <label>준비물 (쉼표로 구분)</label>
    <input id="sItems" maxlength="300" placeholder="예: 러버댐 키트, 핸드피스, 실습 가운">
    <label>메모</label>
    <textarea id="sDetail" maxlength="300"></textarea>
    <div class="err" id="sErr"></div>
    <div class="foot">
      <button class="ghost" onclick="closeSup()">취소</button>
      <button class="solid" id="sSave" onclick="saveSup()">저장</button>
    </div>
  </div>
</div>

<script>
  // ▼ Apps Script 웹 앱 URL (…/exec 로 끝나는 주소). 키는 여기 적지 마세요.
  var API = 'https://script.google.com/macros/s/AKfycbwRnmj7_C7Mlq-0Uri6XcN0SsqzL8szjj2dDTQnDit8xUXj3_prZ7CITfMX6cgBE40p/exec';

  var WD = ['일','월','화','수','목','금','토'];
  var DATA = { tasks: [], rooms: [], supplies: [], labs: {} };
  var KEY = loadKey();
  var editing = null, sEditing = null;
  var TAB = 'tasks';
  try { TAB = localStorage.getItem('dday_tab') || 'tasks'; } catch (e) {}

  function setTab(t) {
    TAB = t;
    try { localStorage.setItem('dday_tab', t); } catch (e) {}
    render();
  }
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function loadKey() {
    var m = /[#&]k=([^&]+)/.exec(location.hash) || /[?&]k=([^&]+)/.exec(location.search);
    var t = m ? decodeURIComponent(m[1]) : '';
    try {
      if (t) { t = t.trim(); localStorage.setItem('notice_token', t); history.replaceState(null, '', location.pathname); }
      else t = localStorage.getItem('notice_token') || '';
    } catch (e) {}
    return t;
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function parseDue(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?$/.exec(s || '');
    if (!m) return null;
    return { day: new Date(+m[1], m[2] - 1, +m[3]),
             end: new Date(+m[1], m[2] - 1, +m[3], m[4] ? +m[4] : 23, m[5] ? +m[5] : 59),
             date: m[1] + '-' + m[2] + '-' + m[3], hm: m[4] ? m[4] + ':' + m[5] : '' };
  }

  function render() {
    document.getElementById('tabTasks').className = TAB === 'tasks' ? 'on' : '';
    document.getElementById('tabSup').className = TAB === 'sup' ? 'on' : '';
    document.getElementById('meta').textContent =
      '마지막 정리 ' + (DATA.lastSync ? DATA.lastSync.slice(5) : '-');
    document.getElementById('addBtn').style.display = DATA.admin ? '' : 'none';
    document.getElementById('addBtn').textContent = TAB === 'sup' ? '＋ 준비물' : '＋ 일정';
    document.getElementById('adminbar').style.display = DATA.admin ? '' : 'none';
    if (TAB === 'sup') return renderSup();
    var now = new Date(), today = dayStart(now);
    var groups = { today: [], tomorrow: [], week: [], later: [] };
    DATA.tasks.forEach(function (t) {
      var d = parseDue(t.due);
      if (!d || d.end < now) return;          // 날짜 없거나 지난 건 숨김
      t._d = d;
      t._diff = Math.round((d.day - today) / 864e5);
      var g = t._diff === 0 ? 'today' : t._diff === 1 ? 'tomorrow' : t._diff <= 7 ? 'week' : 'later';
      groups[g].push(t);
    });

    var labels = [['today', '오늘'], ['tomorrow', '내일'], ['week', '7일 이내'], ['later', '그 이후']];
    var html = '';
    labels.forEach(function (l) {
      var arr = groups[l[0]].sort(function (a, b) { return a._d.end - b._d.end; });
      if (!arr.length) return;
      html += '<section><h2>' + l[1] + ' · ' + arr.length + '</h2>';
      arr.forEach(function (t) { html += itemHtml(t); });
      html += '</section>';
    });
    document.getElementById('list').innerHTML = html || '<div class="msg">다가오는 일정이 없습니다.</div>';
  }

  /* ---------- 실습 준비물 ---------- */
  function renderSup() {
    var now = new Date(), today = dayStart(now);
    var labs = DATA.labs || {}, sup = DATA.supplies || [];
    var days = [];
    for (var i = 0; i < 14 && days.length < 5; i++) {
      var d = new Date(today.getTime() + i * 864e5);
      if (i === 0 && now.getHours() >= 18) continue;          // 저녁엔 오늘 실습은 지난 것으로
      var key = ymd(d);
      var subs = (labs[d.getDay()] || []).slice();
      sup.forEach(function (x) { if (x.date === key && subs.indexOf(x.subject) === -1) subs.push(x.subject); });
      if (subs.length) days.push({ d: d, key: key, diff: i, subs: subs });
    }
    var html = '<section><h2>다가오는 실습 · 공지된 준비물</h2>';
    days.forEach(function (day) {
      var dd = day.diff === 0 ? '오늘' : day.diff === 1 ? '내일' : 'D-' + day.diff;
      var cls = day.diff === 0 ? 'hot' : day.diff === 1 ? 'warm' : '';
      html += '<div class="day"><div class="dayhead"><span class="dt">' + (day.d.getMonth() + 1) + '/' + day.d.getDate() +
              ' (' + WD[day.d.getDay()] + ')</span><span class="dd ' + cls + '">' + dd + '</span></div>';
      day.subs.forEach(function (s) {
        var mine = sup.filter(function (x) { return x.subject === s && x.date === day.key; })
          .concat(sup.filter(function (x) { return x.subject === s && !x.date; }));
        html += '<div class="subj"><div class="subjname"><span>' + esc(s) + ' 실습</span>' +
                (DATA.admin ? '<button onclick="openSup(null,\'' + esc(s) + '\',\'' + day.key + '\')">＋</button>' : '') + '</div>';
        if (!mine.length) html += '<div class="none2">공지된 준비물 없음</div>';
        mine.forEach(function (x) {
          html += '<div class="sup"><span class="k ' + (x.date ? 'once' : '') + '">' + (x.date ? '이번' : '매번') + '</span>' +
                  esc(x.items) + (x.manual ? ' <span class="tag mine">직접 입력</span>' : '') +
                  (x.detail ? '<div class="sd">' + esc(x.detail) + '</div>' : '') +
                  (DATA.admin ? '<div class="acts"><button onclick="openSup(\'' + esc(x.id) + '\')">수정</button>' +
                                '<button onclick="delSup(\'' + esc(x.id) + '\')">삭제</button></div>' : '') + '</div>';
        });
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</section>';
    document.getElementById('list').innerHTML = days.length ? html : '<div class="msg">다가오는 실습이 없습니다.</div>';
  }

  function allSubjects() {
    var out = [], labs = DATA.labs || {};
    Object.keys(labs).forEach(function (k) { labs[k].forEach(function (s) { if (out.indexOf(s) === -1) out.push(s); }); });
    return out;
  }

  function openSup(id, subject, date) {
    sEditing = id ? (DATA.supplies || []).filter(function (x) { return x.id === id; })[0] : null;
    var subj = sEditing ? sEditing.subject : (subject || '');
    document.getElementById('sTitle').textContent = sEditing ? '준비물 수정' : '준비물 추가';
    document.getElementById('sSubject').innerHTML = allSubjects().map(function (s) {
      return '<option' + (s === subj ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('');
    document.getElementById('sDate').value = sEditing ? (sEditing.date || '') : (date || '');
    document.getElementById('sItems').value = sEditing ? sEditing.items : '';
    document.getElementById('sDetail').value = sEditing ? sEditing.detail : '';
    document.getElementById('sErr').textContent = '';
    document.getElementById('ssheet').classList.add('on');
  }
  function closeSup() { document.getElementById('ssheet').classList.remove('on'); sEditing = null; }

  function saveSup() {
    var items = document.getElementById('sItems').value.trim();
    if (!items) { document.getElementById('sErr').textContent = '준비물을 입력하세요.'; return; }
    post({ type: sEditing ? 'sedit' : 'sadd', id: sEditing ? sEditing.id : '',
           subject: document.getElementById('sSubject').value, date: document.getElementById('sDate').value,
           items: items, detail: document.getElementById('sDetail').value.trim() }, 'sup');
  }

  function delSup(id) {
    var x = (DATA.supplies || []).filter(function (y) { return y.id === id; })[0];
    if (!x || !confirm(x.subject + ' 준비물 "' + x.items + '"을(를) 지울까요?\n다음 정리 때도 다시 나타나지 않습니다.')) return;
    post({ type: 'sdelete', id: id }, false);
  }

  function itemHtml(t) {
    var d = t._d.day;
    var dd = t._diff === 0 ? 'D-day' : 'D-' + t._diff;
    var cls = t._diff === 0 ? 'hot' : t._diff <= 2 ? 'warm' : '';
    var time = t._d.hm ? '<b>' + t._d.hm + '</b>' + (t._diff === 0 ? ' 까지' : '')
                       : '<span class="none">시각 미정 (당일 중)</span>';
    var tags = (t.room ? '<span class="tag">' + esc(t.room) + '</span>' : '') +
               (t.manual ? '<span class="tag mine">직접 입력</span>' : '');
    var acts = DATA.admin ? '<div class="acts"><button onclick="openEdit(\'' + esc(t.id) + '\')">수정</button>' +
               '<button onclick="del(\'' + esc(t.id) + '\')">삭제</button></div>' : '';
    return '<div class="item">' +
      '<div class="when"><div class="md">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>' +
      '<div class="wd">' + WD[d.getDay()] + '요일</div>' +
      '<div class="dd ' + cls + '">' + dd + '</div></div>' +
      '<div class="body"><div class="title">' + esc(t.title) + '</div>' +
      '<div class="time">' + time + '</div>' +
      (t.detail ? '<div class="detail">' + esc(t.detail) + '</div>' : '') +
      (tags ? '<div class="tags">' + tags + '</div>' : '') + acts + '</div></div>';
  }

  /* ---------- 관리자 편집 ---------- */
  function openEdit(id) {
    editing = id ? DATA.tasks.filter(function (t) { return t.id === id; })[0] : null;
    var d = editing ? parseDue(editing.due) : null;
    document.getElementById('edTitle').textContent = editing ? '일정 수정' : '일정 추가';
    document.getElementById('fTitle').value = editing ? editing.title : '';
    document.getElementById('fDate').value = d ? d.date : '';
    document.getElementById('fTime').value = d ? d.hm : '';
    document.getElementById('fDetail').value = editing ? editing.detail : '';
    var rooms = (DATA.rooms || []).slice();
    if (editing && editing.room && rooms.indexOf(editing.room) === -1) rooms.push(editing.room);
    document.getElementById('fRoom').innerHTML = rooms.concat(['기타']).map(function (r) {
      return '<option' + (editing && editing.room === r ? ' selected' : '') + '>' + esc(r) + '</option>';
    }).join('');
    document.getElementById('fErr').textContent = '';
    document.getElementById('sheet').classList.add('on');
  }
  function closeEdit() { document.getElementById('sheet').classList.remove('on'); editing = null; }

  function save() {
    var title = document.getElementById('fTitle').value.trim();
    var date = document.getElementById('fDate').value;
    var time = document.getElementById('fTime').value;
    if (!title || !date) { document.getElementById('fErr').textContent = '제목과 날짜는 꼭 입력하세요.'; return; }
    var room = document.getElementById('fRoom').value;
    post({ type: editing ? 'edit' : 'add', id: editing ? editing.id : '', title: title,
           due: date + (time ? ' ' + time : ''), room: room === '기타' ? '' : room,
           detail: document.getElementById('fDetail').value.trim() }, 'task');
  }

  function del(id) {
    var t = DATA.tasks.filter(function (x) { return x.id === id; })[0];
    if (!t || !confirm('"' + t.title + '" 일정을 지울까요?\n다음 정리 때도 다시 나타나지 않습니다.')) return;
    post({ type: 'delete', id: id }, false);
  }

  function post(body, fromSheet) {
    body.token = KEY;
    var btn = document.getElementById(fromSheet === 'sup' ? 'sSave' : 'fSave');
    var errEl = document.getElementById(fromSheet === 'sup' ? 'sErr' : 'fErr');
    btn.disabled = true; btn.textContent = '저장 중…';
    fetch(API, { method: 'POST', credentials: 'omit',
                 headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error || '저장 실패');
        if (fromSheet === 'sup') closeSup(); else if (fromSheet) closeEdit();
        refresh();
      })
      .catch(function (e) {
        if (fromSheet) errEl.textContent = e.message || '저장 실패';
        else alert(e.message || '삭제 실패');
      })
      .then(function () { btn.disabled = false; btn.textContent = '저장'; });
  }

  /* ---------- 불러오기 ---------- */
  function showMsg(html) { document.getElementById('list').innerHTML = '<div class="msg">' + html + '</div>'; }

  function askKey(reason) {
    document.getElementById('meta').textContent = '';
    showMsg((reason ? esc(reason) + '<br>' : '') + '보기 키를 입력하세요.' +
      '<input id="tk" type="password" autocomplete="off"><button onclick="saveKey()">확인</button>');
  }

  function saveKey() {
    KEY = document.getElementById('tk').value.trim();
    try { localStorage.setItem('notice_token', KEY); } catch (e) {}
    refresh();
  }

  function refresh() {
    if (!KEY) return askKey('');
    document.getElementById('meta').textContent = '불러오는 중…';
    fetch(API + '?k=' + encodeURIComponent(KEY) + '&t=' + Date.now(), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) {
          try { localStorage.removeItem('notice_token'); } catch (e) {}
          KEY = '';
          return askKey('키가 맞지 않습니다.');
        }
        DATA = d; render();
      })
      .catch(function () {
        document.getElementById('meta').textContent = '불러오기 실패 · 네트워크나 API 주소를 확인하세요';
      });
  }

  // 이미 열린 페이지에서 주소 끝(#k=...)만 바꿔 열면 페이지가 새로 안 열리므로 직접 감지
  window.addEventListener('hashchange', function () {
    if (/[#&]k=/.test(location.hash)) { KEY = loadKey(); DATA = { tasks: [], rooms: [] }; refresh(); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && KEY) refresh(); });
  setInterval(function () { if (!document.hidden && KEY && !editing && !sEditing) render(); }, 60000);   // 지난 항목 자동으로 빠짐
  refresh();
</script>
</body>
</html>
