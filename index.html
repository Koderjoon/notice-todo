<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>공지 마감</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fffdf8; --ink: #1f1d1a; --sub: #6f6a61; --line: #e4dfd4;
    --hot: #b3261e; --warm: #a15c00; --tag: #ece7dc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --card: #1f1e1b; --ink: #ece8df; --sub: #9a948a; --line: #2e2c28;
            --hot: #f2867e; --warm: #e0a24f; --tag: #2a2824; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  header { padding: 20px 16px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
  .meta { color: var(--sub); font-size: 12px; }
  button.ref { border: 1px solid var(--line); background: var(--card); color: var(--ink);
               border-radius: 8px; padding: 4px 10px; font-size: 13px; flex: none; }
  section { padding: 4px 16px 8px; }
  h2 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 16px 0 6px; }
  .item { display: flex; gap: 14px; padding: 12px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
  .when { flex: none; width: 64px; text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }
  .md { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .wd { font-size: 12px; color: var(--sub); }
  .dd { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; }
  .hot { color: var(--hot); } .warm { color: var(--warm); }
  .body { min-width: 0; }
  .title { font-weight: 600; }
  .time { font-size: 14px; margin-top: 2px; }
  .time b { font-weight: 700; }
  .time .none { color: var(--sub); }
  .room { display: inline-block; background: var(--tag); border-radius: 4px; padding: 0 5px; font-size: 12px; margin-top: 4px; }
  .detail { font-size: 13px; color: var(--sub); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .msg { color: var(--sub); padding: 32px 16px; text-align: center; }
  .msg input { width: 100%; margin-top: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
               background: var(--card); color: var(--ink); font-size: 15px; }
  .msg button { margin-top: 8px; width: 100%; padding: 10px; border: 0; border-radius: 8px;
                background: var(--ink); color: var(--bg); font-size: 15px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>다가오는 마감</h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </div>
  <button class="ref" onclick="refresh()">새로고침</button>
</header>
<main id="list"></main>

<script>
  // ▼ Apps Script 웹 앱 URL (…/exec 로 끝나는 주소). 토큰은 여기 적지 마세요.
  var API = 'https://script.google.com/macros/s/여기에-배포ID/exec';

  var WD = ['일','월','화','수','목','금','토'];
  var DATA = { tasks: [], now: '', lastMessage: '' };
  var TOKEN = loadToken();

  function loadToken() {
    var m = /[#&]k=([^&]+)/.exec(location.hash);
    var t = m ? decodeURIComponent(m[1]) : '';
    try {
      if (t) { localStorage.setItem('notice_token', t); history.replaceState(null, '', location.pathname); }
      else t = localStorage.getItem('notice_token') || '';
    } catch (e) {}
    return t;
  }

  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function parseDue(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?$/.exec(s || '');
    if (!m) return null;
    return { day: new Date(+m[1], m[2] - 1, +m[3]),
             end: new Date(+m[1], m[2] - 1, +m[3], m[4] ? +m[4] : 23, m[5] ? +m[5] : 59),
             hm: m[4] ? m[4] + ':' + m[5] : '' };
  }

  function render() {
    var now = new Date(), today = dayStart(now);
    var groups = { today: [], tomorrow: [], week: [], later: [] };
    DATA.tasks.forEach(function (t) {
      var d = parseDue(t.due);
      if (!d || d.end < now) return;          // 날짜 없거나 지난 건 숨김
      t._d = d;
      t._diff = Math.round((d.day - today) / 864e5);
      var g = t._diff === 0 ? 'today' : t._diff === 1 ? 'tomorrow' : t._diff <= 7 ? 'week' : 'later';
      groups[g].push(t);
    });

    var labels = [['today', '오늘'], ['tomorrow', '내일'], ['week', '7일 이내'], ['later', '그 이후']];
    var html = '';
    labels.forEach(function (l) {
      var arr = groups[l[0]].sort(function (a, b) { return a._d.end - b._d.end; });
      if (!arr.length) return;
      html += '<section><h2>' + l[1] + ' · ' + arr.length + '</h2>';
      arr.forEach(function (t) { html += itemHtml(t); });
      html += '</section>';
    });
    document.getElementById('list').innerHTML = html || '<div class="msg">다가오는 마감이 없습니다.</div>';
    document.getElementById('meta').textContent =
      '마지막 공지 ' + (DATA.lastMessage ? DATA.lastMessage.slice(5) : '-') + ' · 갱신 ' + (DATA.now || '').slice(5);
  }

  function itemHtml(t) {
    var d = t._d.day;
    var dd = t._diff === 0 ? 'D-day' : 'D-' + t._diff;
    var cls = t._diff === 0 ? 'hot' : t._diff <= 2 ? 'warm' : '';
    var time = t._d.hm ? '<b>' + t._d.hm + '</b>' + (t._diff === 0 ? ' 까지' : '')
                       : '<span class="none">시각 미정 (당일 중)</span>';
    return '<div class="item">' +
      '<div class="when"><div class="md">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>' +
      '<div class="wd">' + WD[d.getDay()] + '요일</div>' +
      '<div class="dd ' + cls + '">' + dd + '</div></div>' +
      '<div class="body"><div class="title">' + esc(t.title) + '</div>' +
      '<div class="time">' + time + '</div>' +
      (t.detail ? '<div class="detail">' + esc(t.detail) + '</div>' : '') +
      '<span class="room">' + esc(t.room) + '</span></div></div>';
  }

  function showMsg(html) { document.getElementById('list').innerHTML = '<div class="msg">' + html + '</div>'; }

  function askToken(reason) {
    document.getElementById('meta').textContent = '';
    showMsg((reason ? esc(reason) + '<br>' : '') + '토큰을 입력하세요.' +
      '<input id="tk" type="password" autocomplete="off"><button onclick="saveToken()">확인</button>');
  }

  function saveToken() {
    TOKEN = document.getElementById('tk').value.trim();
    try { localStorage.setItem('notice_token', TOKEN); } catch (e) {}
    refresh();
  }

  function refresh() {
    if (!TOKEN) return askToken('');
    document.getElementById('meta').textContent = '불러오는 중…';
    fetch(API + '?format=json&k=' + encodeURIComponent(TOKEN), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) {
          try { localStorage.removeItem('notice_token'); } catch (e) {}
          TOKEN = '';
          return askToken('토큰이 맞지 않습니다.');
        }
        DATA = d; render();
      })
      .catch(function () {
        document.getElementById('meta').textContent = '불러오기 실패 · 네트워크나 API 주소를 확인하세요';
      });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && TOKEN) refresh(); });
  setInterval(function () { if (!document.hidden && TOKEN) render(); }, 60000);   // 시간이 지나면 지난 항목 자동으로 빠짐
  refresh();
</script>
</body>
</html>
